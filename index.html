.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,13,11,.15),rgba(16,13,11,.9) 88%)}
.hero-content{position:relative;text-align:center;padding:100px 20px 50px;max-width:760px}.brand-mark{font:800 56px Montserrat,sans-serif;letter-spacing:4px;text-shadow:0 5px 0 #7b1716;color:white}
.eyebrow{color:var(--gold);font-weight:800;font-size:18px;margin:5px 0}.hero h1{font-size:clamp(34px,7vw,64px);margin:8px 0 4px}.sub{font-size:18px;color:#f1dfbd}
.hero-actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:13px 22px;font-weight:800;cursor:pointer;font:700 15px Cairo}
.primary{background:var(--red);color:white;box-shadow:0 10px 30px #0006}.ghost{border:1px solid #fff4;background:#fff1;color:white}
main{max-width:1180px;margin:auto;padding:0 16px 80px}.sticky-tools{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 75%,transparent);padding:18px 0 22px}
.search-wrap{max-width:700px;margin:0 auto 14px;background:#1e1814;border:1px solid #ffffff18;border-radius:18px;display:flex;align-items:center;padding:0 15px;color:var(--gold)}
.search-wrap span{font-size:28px}.search-wrap input{width:100%;background:none;border:0;outline:0;color:white;font:600 16px Cairo;padding:14px}
.cats{display:flex;gap:8px;overflow:auto;padding-bottom:5px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid #ffffff18;background:#1c1713;color:#d9ccb6;border-radius:999px;padding:9px 16px;font:700 14px Cairo;cursor:pointer}.cat.active{background:var(--red);color:white;border-color:var(--red)}
.section{padding-top:25px}.section-title{display:flex;align-items:end;gap:14px;margin:15px 0 18px}.section-title span{font:800 11px Montserrat;color:var(--gold);letter-spacing:2px}.section-title h2{font-size:30px;margin:0}.line{height:1px;background:linear-gradient(90deg,#ffffff00,#ffffff2a);flex:1;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{background:linear-gradient(145deg,#201914,#16110e);border:1px solid #ffffff12;border-radius:24px;padding:10px;display:flex;align-items:center;gap:12px;min-height:122px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#b5262248}
.card img{width:104px;height:104px;border-radius:18px;object-fit:cover;flex:0 0 auto}.card-info{min-width:0;flex:1}.card h3{font-size:17px;margin:0 0 7px;line-height:1.45}.prices{display:flex;gap:7px;flex-wrap:wrap}.price,.price-single{font-weight:800;color:var(--cream);font-size:15px}.price b{font:800 10px Montserrat;background:var(--red);border-radius:6px;padding:4px 6px;margin-left:3px;color:white}.price small,.price-single small{font-size:10px;color:var(--muted)}
.add{margin-top:8px;border:1px solid #ffffff14;background:#2b211b;color:#f8e9ca;border-radius:10px;padding:6px 9px;font:700 12px Cairo;cursor:pointer}.add:hover{background:var(--red);color:#fff}.empty{text-align:center;padding:60px;color:var(--muted)}
.cart{position:fixed;z-index:50;top:0;right:0;width:min(420px,94vw);height:100dvh;background:#17120f;border-left:1px solid #fff1;transform:translateX(105%);transition:.3s;display:flex;flex-direction:column}.cart.open{transform:none}.shade{position:fixed;inset:0;background:#0009;z-index:45;display:none}.shade.open{display:block}.cart-head{padding:18px;border-bottom:1px solid #fff1;display:flex;justify-content:space-between;align-items:center}.cart-head strong{font-size:22px}.cart-head span{background:var(--red);border-radius:99px;padding:2px 8px;margin-right:8px;font-size:12px}.cart-head button{background:none;color:white;border:0;font-size:28px}.cart-items{padding:15px;overflow:auto;flex:1}.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #fff1}.cart-row strong{display:block;font-size:14px}.cart-row small{color:var(--muted)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid #fff2;background:#211a15;color:white}.cart-foot{padding:16px;border-top:1px solid #fff1}.total{display:flex;justify-content:space-between;font-size:18px;margin-bottom:12px}.full{width:100%}.cart-foot small{display:block;text-align:center;color:var(--muted);margin-top:8px}.empty-cart{text-align:center;color:var(--muted);padding:50px 10px}.cart-fab{position:fixed;z-index:40;bottom:18px;left:18px;border:0;background:var(--red);color:#fff;border-radius:18px;padding:13px 16px;font:800 15px Cairo;box-shadow:0 12px 35px #0008}.cart-fab span{background:#fff;color:var(--red);border-radius:99px;padding:1px 6px;margin-right:4px}
footer{background:#0a0807;border-top:1px solid #fff1;padding:40px 20px;text-align:center;color:var(--muted)}.footer-brand{font:800 30px Montserrat;color:white;letter-spacing:3px}.contact{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}.contact a{border:1px solid #fff2;border-radius:12px;padding:8px 12px;color:#f0dfc0}.cash{color:var(--gold);font-weight:800}
@media(max-width:600px){.hero{min-height:470px}.hero-content{padding-top:90px}.brand-mark{font-size:45px}.hero h1{font-size:38px}.grid{grid-template-columns:1fr}.card{min-height:112px}.card img{width:94px;height:94px}.section-title h2{font-size:25px}}

<body>
<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="brand-mark">TOKYO</div>
    <p class="eyebrow">كل اللي بتحبه.. في مكان واحد</p>
    <h1>أهلاً بيكم في طوكيو</h1>
    <p class="sub">بيتزا • ساندوتشات • كريب • فطائر</p>
    <div class="hero-actions">
      <a class="btn primary" href="https://wa.me/201221104263?text=مرحباً%20TOKYO%20عايز%20أطلب%20أوردر" target="_blank">اطلب واتساب</a>
      <a class="btn ghost" href="tel:01221104263">اتصل بنا</a>
    </div>
  </div>
</header>

<main>
  <section class="sticky-tools">
    <div class="search-wrap">
      <span>⌕</span>
      <input id="search" type="search" placeholder="دور على صنف..." autocomplete="off">
    </div>
    <div id="cats" class="cats"></div>
  </section>

  <section id="menu" class="menu"></section>
</main>

<aside id="cart" class="cart">
  <div class="cart-head">
    <div><strong>طلبك</strong><span id="cartCount">0</span></div>
    <button id="closeCart">×</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-foot">
    <div class="total"><span>الإجمالي</span><strong id="total">0 ج.م</strong></div>
    <button id="sendOrder" class="btn primary full">إرسال الطلب على واتساب</button>
    <small>سيتم فتح واتساب برسالة الطلب جاهزة.</small>
  </div>
</aside>
<div id="cartShade" class="shade"></div>
<button id="cartFab" class="cart-fab">🛒 <span id="fabCount">0</span></button>

<footer>
  <div class="footer-brand">TOKYO</div>
  <p>مغاغة — شارع السلام — أمام هارد روك</p>
  <div class="contact">
    <a href="tel:01221104263">☎ 01221104263</a>
    <a href="https://wa.me/201221104263" target="_blank">واتساب</a>
    <a href="https://facebook.com/TOKYO" target="_blank">فيسبوك @TOKYO</a>
  </div>
  <p class="cash">كاش: 01100329865</p>
</footer>

<script>
const MENU = {"فطائر حلو": [["فطيرة قشطة وعسل", 110, 140], ["فطيرة مكسرات", 150, 180], ["فطيرة كاسترد", 100, 130], ["فطيرة نوتيلا", 120, 150], ["فطيرة بسكوتية وكنافة", 110, 140], ["فطيرة بغاشة", 70, 100], ["فطيرة لوتس", 120, 150]], "إضافات": [["جبنة موتزريلا", 10, null], ["جبنة رومي", 20, null], ["بطاطس", 20, null], ["مشروم", 10, null], ["صوص سويت شيلي", 20, null], ["صوص رانش", 25, null], ["صوص باربيكيو", 25, null], ["صوص سموكي فاير", 20, null]], "كريب": [["كريب برجر لحمة", 80, null], ["كريب لحمة مفرومة", 90, null], ["كريب كفتة", 85, null], ["كريب سجق", 80, null], ["كريب سوسيس لحمة", 75, null], ["كريب شاورما فراخ", 90, null], ["كريب بانيه", 80, null], ["كريب سترس", 90, null], ["كريب شيش طاووق", 90, null], ["كريب فاهيتا", 100, null], ["كريب بطاطس", 60, null], ["كريب تونة", 95, null], ["كريب جمبري", 125, null], ["كريب ميكس جبن", 90, null], ["كريب ميكس لحوم", 105, null], ["كريب ميكس فراخ", 110, null], ["كريب مشروم", 60, null], ["كريب تشيكن رانش", 110, null], ["كريب تشيكن باربيكيو", 110, null]], "فطائر": [["فطيرة برجر لحمة", 160, 210], ["فطيرة لحمة مفرومة", 175, 210], ["فطيرة كفتة", 165, 200], ["فطيرة سجق", 165, 205], ["فطيرة سوسيس لحمة", 160, 200], ["فطيرة شاورما فراخ", 175, 225], ["فطيرة بانيه", 160, 190], ["فطيرة سترس", 170, 200], ["فطيرة شيش طاووق", 160, 200], ["فطيرة فاهيتا", 190, 215], ["فطيرة بسطرمة", 240, 280], ["فطيرة ميكس جبن", 150, 190], ["فطيرة ميكس لحوم", 195, 245], ["فطيرة ميكس فراخ", 195, 245], ["فطيرة تونة", 180, 225], ["فطيرة تشيكن رانش", 170, 225], ["فطيرة تشيكن باربيكيو", 195, 225], ["فطيرة مشروم", 145, 170], ["فطيرة جمبري", 215, 265]], "بيتزا": [["بيتزا برجر لحمة", 135, 175], ["بيتزا لحمة مفرومة", 150, 190], ["بيتزا كفتة", 140, 180], ["بيتزا سجق", 140, 180], ["بيتزا سوسيس لحمة", 135, 175], ["بيتزا شاورما فراخ", 150, 190], ["بيتزا بانيه", 135, 175], ["بيتزا سترس", 150, 190], ["بيتزا شيش طاووق", 150, 190], ["بيتزا فاهيتا", 165, 200], ["بيتزا بسطرمة", 220, 240], ["بيتزا ميكس جبن", 150, 175], ["بيتزا ميكس لحوم", 170, 210], ["بيتزا ميكس فراخ", 170, 210], ["بيتزا تونة", 145, 190], ["بيتزا تشيكن رانش", 170, 210], ["بيتزا تشيكن باربيكيو", 170, 210], ["بيتزا مشروم", 120, 150], ["بيتزا جمبري", 190, 230]], "ساندوتشات": [["ساندوتش كفتة", 70, null], ["ساندوتش كبدة جريل", 40, null], ["ساندوتش سجق", 70, null], ["ساندوتش فاهيتا فراخ", 80, null], ["ساندوتش زنجر", 85, null], ["ساندوتش شاورما فراخ فرنساوي", 70, null], ["ساندوتش شاورما فراخ سوري", 70, null], ["ساندوتش بطاطس سوري", 35, null], ["ساندوتش برجر لحمة", 110, null], ["ساندوتش برجر فراخ", 110, null], ["ساندوتش تويستر", 85, null]], "مكرونة": [["مكرونة شاورما فراخ", 110, 150], ["مكرونة لحمة مفرومة", 110, 150]]};
const ASSET = {"فطائر حلو": "sweet", "إضافات": "extras", "كريب": "crepe", "فطائر": "pie", "بيتزا": "pizza", "ساندوتشات": "sandwich", "مكرونة": "pasta"};
const WA = "201221104263";
let cart = [];

function priceHTML(a,b){
  if(b===null || b===undefined) return `<span class="price-single">${a} <small>ج.م</small></span>`;
  return `<span class="price"><b>M</b>${a} <small>ج.م</small></span><span class="price"><b>L</b>${b} <small>ج.م</small></span>`;
}
function renderCats(){
  const cats=document.getElementById('cats');
  cats.innerHTML = `<button class="cat active" data-cat="all">الكل</button>`+
    Object.keys(MENU).map(c=>`<button class="cat" data-cat="${c}">${c}</button>`).join('');
  cats.querySelectorAll('.cat').forEach(btn=>btn.onclick=()=>{
    cats.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(btn.dataset.cat, document.getElementById('search').value);
  });
}
function renderMenu(filter='all', q=''){
  const root=document.getElementById('menu');
  const sections=Object.entries(MENU).filter(([cat])=>filter==='all'||cat===filter).map(([cat,items])=>{
    const filtered=items.filter(([name])=>name.includes(q.trim()));
    if(!filtered.length) return '';
    const img=ASSET[cat];
    return `<section class="section" id="${cat}">
      <div class="section-title"><div><span>MENU</span><h2>${cat}</h2></div><div class="line"></div></div>
      <div class="grid">${filtered.map((item,i)=>`
        <article class="card">
          <img src="assets/${img}.svg" alt="${item[0]}" loading="lazy">
          <div class="card-info">
            <h3>${item[0]}</h3>
            <div class="prices">${priceHTML(item[1],item[2])}</div>
            <button class="add" onclick='addToCart(${JSON.stringify(item[0])}, ${item[1]})'>+ أضف للطلب</button>
          </div>
        </article>`).join('')}</div>
    </section>`;
  }).join('');
  root.innerHTML=sections || `<div class="empty">مش لاقي الصنف ده 😅</div>`;
}
function addToCart(name, price){
  const found=cart.find(x=>x.name===name && x.price===price);
  if(found) found.qty++;
  else cart.push({name,price,qty:1});
  updateCart();
}
function updateCart(){
  const count=cart.reduce((s,x)=>s+x.qty,0);
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById('cartCount').textContent=count;
  document.getElementById('fabCount').textContent=count;
  document.getElementById('total').textContent=total+' ج.م';
  document.getElementById('cartItems').innerHTML=cart.length?cart.map((x,i)=>`
    <div class="cart-row"><div><strong>${x.name}</strong><small>${x.price} ج.م × ${x.qty}</small></div>
    <div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`).join(''):`<div class="empty-cart">السلة فاضية — اختار اللي نفسك فيه ❤️</div>`;
}
function changeQty(i,d){
  cart[i].qty+=d;
  if(cart[i].qty<=0) cart.splice(i,1);
  updateCart();
}
function openCart(){document.getElementById('cart').classList.add('open');document.getElementById('cartShade').classList.add('open')}
function closeCart(){document.getElementById('cart').classList.remove('open');document.getElementById('cartShade').classList.remove('open')}
document.getElementById('cartFab').onclick=openCart;
document.getElementById('closeCart').onclick=closeCart;
document.getElementById('cartShade').onclick=closeCart;
document.getElementById('search').oninput=e=>{
  const active=document.querySelector('.cat.active')?.dataset.cat||'all';
  renderMenu(active,e.target.value);
};
document.getElementById('sendOrder').onclick=()=>{
  if(!cart.length) return alert('اختار صنف واحد على الأقل الأول.');
  const lines=cart.map(x=>`• ${x.name} — ${x.qty} × ${x.price} = ${x.qty*x.price} ج.م`);
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  const text=`مرحباً TOKYO 👋%0Aعايز أطلب:%0A${encodeURIComponent(lines.join("\n"))}%0A%0Aالإجمالي: ${total} ج.م`;
  window.open(`https://wa.me/${WA}?text=${text}`,'_blank');
};
renderCats(); renderMenu(); updateCart();
</script>
</body>
</html>
